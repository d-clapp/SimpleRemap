name: Release

# builds SimpleRemap.exe and attaches it to a GitHub Release whenever a
# version tag (e.g. v1.0.0) is pushed
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build exe
        run: .\build.bat
        shell: cmd

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SimpleRemap.exe
          generate_release_notes: true
